<!--
  Formulario de restablecimiento de contraseña.
-->

<section class="reset-page">
  <header class="reset-page__header">
    <span>Nueva contraseña</span>
    <h2>Restablecer contraseña</h2>
    <p>Defina una nueva contraseña para recuperar el acceso.</p>
  </header>

  <form class="reset-page__form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline" class="reset-page__field">
      <mat-label>Nueva contraseña</mat-label>

      <input
        matInput
        id="password"
        name="password"
        type="password"
        placeholder="Mínimo 8 caracteres"
        autocomplete="new-password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
      />

      <mat-icon matSuffix>lock</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="reset-page__field">
      <mat-label>Confirmar nueva contraseña</mat-label>

      <input
        matInput
        id="confirmPassword"
        name="confirmPassword"
        type="password"
        placeholder="Repita la nueva contraseña"
        autocomplete="new-password"
        [ngModel]="confirmPassword()"
        (ngModelChange)="confirmPassword.set($event)"
      />

      <mat-icon matSuffix>lock_reset</mat-icon>
    </mat-form-field>

    @if (errorMessage()) {
      <div class="reset-page__error">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <button
      mat-flat-button
      color="primary"
      class="reset-page__submit"
      type="submit"
      [disabled]="loading()"
    >
      @if (loading()) {
        <span class="reset-page__button-content">
          <mat-progress-spinner
            mode="indeterminate"
            diameter="20"
          />

          <span>Actualizando contraseña...</span>
        </span>
      } @else {
        <span class="reset-page__button-content">
          <mat-icon>lock_reset</mat-icon>
          <span>Restablecer contraseña</span>
        </span>
      }
    </button>
  </form>

  <footer class="reset-page__footer">
    <a routerLink="/auth/login">
      Volver al inicio de sesión
    </a>
  </footer>
</section>
